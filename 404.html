<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Sai Siddhanth Challa</title>
  <meta name="robots" content="noindex">
  <!-- Self-contained: GitHub Pages serves this at any missing URL depth, so no relative assets. -->
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; text-align: center; color: #f3e6d6; font: 17px/1.6 Georgia, 'Iowan Old Style', serif; padding: 16px;
      background: radial-gradient(900px 500px at 50% 110%, rgba(255, 122, 42, 0.28), transparent 70%), #0b0605; overflow: hidden; }
    .sun { position: fixed; left: 50%; bottom: 14vh; width: 140px; height: 140px; margin-left: -70px; border-radius: 50%;
      background: radial-gradient(circle, #fff1c8 0 40%, rgba(255, 160, 80, 0.6) 55%, transparent 72%); animation: sink 9s ease-in-out infinite alternate; }
    @keyframes sink { to { transform: translateY(70px); } }
    .sea { position: fixed; left: 0; right: 0; bottom: 0; height: 18vh; background: linear-gradient(#2a1840, #120818); }
    main { position: relative; z-index: 1; max-width: 34rem; }
    h1 { font-weight: 400; font-size: clamp(2.6rem, 9vw, 5.5rem); line-height: 1; margin: 0 0 16px; letter-spacing: -0.03em; }
    h1 em { color: #ffb26b; }
    p { color: rgba(255, 247, 238, 0.8); }
    a { display: inline-block; margin-top: 14px; padding: 12px 22px; border-radius: 999px; background: #f3e6d6; color: #1a0d06; text-decoration: none; font: 500 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <main>
    <h1>Page <em>not found.</em></h1>
    <p>This address doesn’t lead anywhere. The front page has everything.</p>
    <a id="home" href="/">Go to the front page →</a>
  </main>
  <script>
    // On a GitHub Pages project site (user.github.io/repo/) home is /repo/, not /.
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
