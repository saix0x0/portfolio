  <meta charset="utf-8">

  <meta property="og:url" content="https://saix0x0.github.io/portfolio/compass/">

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>document.documentElement.classList.add('js')</script>

</head>
<body data-page="compass">
  <a class="skip" href="#board">Skip to links</a>
  <main class="page wrap">
    <header class="page-head">
      <p class="kicker reveal"><span class="dot"></span>The compass</p>
      <h1 class="reveal">Where I go <em class="serif">every day.</em></h1>
      <p class="lede reveal">My departures board — set it as your browser’s homepage. Type to filter, <kbd>↑</kbd><kbd>↓</kbd> to choose, <kbd>↵</kbd> to fly.</p>
    </header>
    <section class="board reveal" id="board" aria-label="Departures">
      <div class="board-head">
        <div class="flap" aria-label="Departures" data-flap></div>
        <label class="search" style="max-width:340px"><span class="sr-only">Filter links</span><input class="field" type="search" placeholder="Where to?" data-q data-own-slash autocomplete="off"></label>
        <span class="board-clock" data-clock></span>
      </div>
      <div data-groups></div>
      <details class="dep-group"><summary class="meta" style="cursor:pointer">+ Add a link (saved in this browser only)</summary>
        <form class="add-link" data-add>
          <input class="field" name="name" placeholder="Name" required>
          <input class="field" name="url" type="url" placeholder="https://…" required>
          <input class="field" name="note" placeholder="Note (optional)">
          <button class="btn small" type="submit">Add</button>
        </form>
        <p class="meta">To make a link permanent for everyone, add it to <code>content/links.js</code>.</p>
      </details>
    </section>
  </main>
</body>
</html>
