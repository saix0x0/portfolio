# Deploys the site to GitHub Pages on every push to main. Free for public repos.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.mjs
      - name: Stage public files only
        # Not deployed for now (owner's call): the hotel game (site.game) and the
        # two encrypted rooms (site.rooms). Their files stay in the repo.
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'private' --exclude 'scripts' --exclude 'docs' --exclude '*.md' \
            --exclude '/hotel' --exclude '/assets/js/world' --exclude '/assets/css/world.css' --exclude '/content/notes.js' \
            --exclude '/_site' --exclude '/vault' --exclude '/observatory' --exclude '/assets/js/pages/vault.js' --exclude '/assets/js/pages/observatory.js' --exclude '/assets/js/core/vault.js' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
