<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Edit · Sai Siddhanth Challa</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600..900&family=Fragment+Mono&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
  <link rel="stylesheet" href="../assets/css/edit.css">
  <script type="module" src="../assets/js/pages/edit.js"></script>
</head>
<body>
  <!-- The owner's door: a password unlocks the editor, Finalise commits
       content/live.js through GitHub. The password decrypts a token kept only
       as ciphertext in edit/lock.json (assets/js/pages/edit.js). -->
  <header class="ed-top">
    <a href="../">← Site</a>
    <a href="../desk/">Desk</a>
    <span data-who class="ed-who"></span>
  </header>
  <main class="ed">
    <h1>Owner</h1>
    <p class="ed-lede">Sign in to change the site’s words. <b>Finalise</b> publishes them, and the live site updates about a minute later.</p>
    <div data-gate><p class="ed-dim">Opening…</p></div>
    <div data-form hidden></div>
  </main>
  <div class="ed-bar" data-bar hidden>
    <span data-count>No changes</span>
    <input data-msg placeholder="What changed? (optional)" aria-label="Note for this change">
    <button type="button" class="ed-ghost" data-discard>Discard</button>
    <button type="button" class="ed-go" data-final>Finalise &amp; publish</button>
  </div>
  <noscript><p class="ed">The editor needs JavaScript.</p></noscript>
</body>
</html>
